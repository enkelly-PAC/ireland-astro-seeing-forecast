[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meteoblue-seeing-reconstruction"
version = "0.1.0"
description = "Independent reconstruction of meteoblue style astronomy seeing forecasts with planetary observing details. Not derived from proprietary source code."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Astra Smith reconstruction project" }]
keywords = ["astronomy", "seeing", "atmospheric-optics", "meteoblue", "Cn2", "Fried-parameter"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "License :: OSI Approved :: MIT License",
]
dependencies = ["astronomy-engine>=2.1.19,<3"]

[project.optional-dependencies]
ukv = ["netCDF4>=1.7", "pyproj>=3.7"]

[project.scripts]
meteoblue-seeing = "meteoblue_seeing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
meteoblue_seeing = ["py.typed", "assets/*.html", "assets/*.webp"]
